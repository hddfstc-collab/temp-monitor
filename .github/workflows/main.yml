name: Temperature Collector (Node.js)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install
          npm ls firebase-admin
          npm ls @firebase/app

      - name: Run collector
        env:
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          TUYA_SECRET_KEY: ${{ secrets.TUYA_SECRET_KEY }}
        run: node test.js
