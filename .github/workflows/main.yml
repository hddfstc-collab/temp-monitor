name: Temperature Collector (Node.js)

on:
  schedule:
    - cron: '*/10 * * * *' # 10분마다 자동으로 실행
  workflow_dispatch: # 수동 실행 버튼을 활성화합니다.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install

      - name: Run collector
        run: node test.js # 이제 collect.py 대신 test.js를 실행합니다!
