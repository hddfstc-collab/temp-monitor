name: 무역센터 온도 자동수집

on:
  schedule:
    - cron: '*/10 * * * *'  # 10분마다 실행
  workflow_dispatch:        # 수동 실행 버튼 활성화

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: 파이썬 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: 필수 도구 설치
        run: pip install requests firebase-admin
      - name: 데이터 수집 시작
        run: python collect.py
