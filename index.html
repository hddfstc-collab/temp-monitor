<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>무역센터 온도 관제 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        h1 { text-align: center; color: #1a73e8; margin-bottom: 30px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); cursor: pointer; transition: 0.3s; text-align: center; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .temp { font-size: 36px; font-weight: bold; color: #d93025; margin: 10px 0; }
        .humi { font-size: 20px; color: #1976d2; }
        .updated { font-size: 12px; color: #70757a; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
        
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .modal-content { background: white; margin: 50px auto; padding: 30px; border-radius: 20px; width: 90%; max-width: 1000px; position: relative; }
        .close { position: absolute; right: 25px; top: 15px; font-size: 30px; cursor: pointer; }
        .controls { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; margin-bottom: 25px; padding: 15px; background: #f8f9fa; border-radius: 10px; }
        input[type="date"] { padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-search { background: #1a73e8; color: white; }
        .btn-excel { background: #1e7e34; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>무역센터점 온도 관제 실시간 현황</h1>
        <div id="cardGrid" class="card-grid"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">데이터 상세 분석</h2>
            <div class="controls">
                <input type="date" id="startDate"> <span>~</span> <input type="date" id="endDate">
                <button class="btn-search" onclick="loadFilteredData()">조회</button>
                <button class="btn-excel" onclick="downloadExcel()">엑셀 다운로드</button>
            </div>
            <div style="height: 400px;"><canvas id="tempChart"></canvas></div>
        </div>
    </div>

    <script>
        // 최상위 주소로 설정 완료
        const firebaseConfig = {
            databaseURL: "https://temp-monitoring-8b172-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentDeviceId = '';
        let myChart = null;

        // 실시간 카드 업데이트
        database.ref('devices').on('value', (snapshot) => {
            const devices = snapshot.val();
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            
            for (let id in devices) {
                const dev = devices[id];
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(id, dev.name || id);
                card.innerHTML = `
                    <h3>${dev.name || id}</h3>
                    <div class="temp">${dev.temperature || '--'}°C</div>
                    <div class="humi">💧 습도: ${dev.humidity || '--'}%</div>
                    <div class="updated">🕒 업데이트: ${dev.lastUpdated || '연결 대기'}</div>
                `;
                grid.appendChild(card);
            }
        });

        function openModal(deviceId, deviceName) {
            currentDeviceId = deviceId;
            document.getElementById('modalTitle').innerText = `[${deviceName}] 온도 히스토리`;
            document.getElementById('modal').style.display = 'block';

            // 오늘 날짜 자동 세팅
            const now = new Date();
            const kstDate = new Date(now.getTime() + (9 * 60 * 60 * 1000)).toISOString().split('T')[0];
            document.getElementById('startDate').value = kstDate;
            document.getElementById('endDate').value = kstDate;

            loadFilteredData();
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function loadFilteredData() {
            const startStr = document.getElementById('startDate').value;
            const endStr = document.getElementById('endDate').value;
            if (!startStr || !endStr) return;

            const startTs = new Date(startStr + "T00:00:00").getTime();
            const endTs = new Date(endStr + "T23:59:59").getTime();

            database.ref(`history/${currentDeviceId}`)
                .orderByKey()
                .startAt(startTs.toString())
                .endAt(endTs.toString())
                .once('value', (snapshot) => {
                    const data = snapshot.val();
                    const labels = [], temps = [], humis = [];
                    if (data) {
                        Object.keys(data).sort().forEach(ts => {
                            const date = new Date(parseInt(ts));
                            labels.push(`${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`);
                            temps.push(data[ts].temperature);
                            humis.push(data[ts].humidity);
                        });
                    }
                    renderChart(labels, temps, humis);
                });
        }

        function renderChart(labels, temps, humis) {
            const ctx = document.getElementById('tempChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '온도(°C)', data: temps, borderColor: '#d93025', backgroundColor: 'rgba(217, 48, 37, 0.1)', fill: true, tension: 0.3 },
                        { label: '습도(%)', data: humis, borderColor: '#1a73e8', borderDash: [5, 5], fill: false, tension: 0.3 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function downloadExcel() {
            const startStr = document.getElementById('startDate').value;
            const endStr = document.getElementById('endDate').value;
            database.ref(`history/${currentDeviceId}`)
                .orderByKey()
                .startAt(new Date(startStr + "T00:00:00").getTime().toString())
                .endAt(new Date(endStr + "T23:59:59").getTime().toString())
                .once('value', (snapshot) => {
                    const data = snapshot.val();
                    let csv = "\ufeff시간,온도,습도\n";
                    if (data) {
                        Object.keys(data).sort().forEach(ts => {
                            csv += `${new Date(parseInt(ts)).toLocaleString()},${data[ts].temperature},${data[ts].humidity}\n`;
                        });
                    }
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(blob);
                    link.download = `관제데이터_${currentDeviceId}_${startStr}.csv`;
                    link.click();
                });
        }
    </script>
</body>
</html>
